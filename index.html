<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NIGHTHAWK</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  html,body{margin:0;height:100%;background:#0b0e13;overflow:hidden;font-family:system-ui,sans-serif;user-select:none;touch-action:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 0 4px #000}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#ff5b5b;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
  #info{position:absolute;left:12px;top:10px;font-size:13px;line-height:1.5;opacity:.9}
  #stats{position:absolute;right:12px;top:10px;font-size:13px;text-align:right}
  #click{position:absolute;left:50%;top:60%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.55);font-size:14px;letter-spacing:1px}
  #rotate{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:#0b0e13;color:#ffcf4d;font-size:22px;letter-spacing:3px;text-align:center}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="cross"></div>
  <div id="info">NIGHTHAWK · tech proof<br>WASD move · Shift sprint · Space jump<br>Mouse aim · Click fire · G grenade · R reset</div>
  <div id="stats"><span id="fps">0</span> fps<br>bots: <span id="bots">0</span> · kills: <span id="kills">0</span></div>
  <div id="click">CLICK TO PLAY</div>
</div>
<div id="rotate">ROTATE YOUR PHONE<br><small>landscape only</small></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
